spring.application.name=nexusmart-api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nexusmart_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=12345

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=nexusmart-secret-key-change-in-production-environment-minimum-256-bits
jwt.expiration=86400000

# Spring AI Configuration
spring.ai.openai.api-key= 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
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.embedding.options.model=text-embedding-3-small

# CORS Configuration
cors.allowed-origins=http://localhost:3000

# Rate Limiting Configuration
rate.limit.attempts=5
rate.limit.duration=60