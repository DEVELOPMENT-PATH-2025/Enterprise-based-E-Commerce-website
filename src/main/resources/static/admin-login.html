<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Access - NexusMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#050813',
                        'surface-1': 'rgba(13, 20, 36, 0.7)',
                        'surface-2': 'rgba(20, 30, 50, 0.8)',
                        'quantum-cyan': '#00f0ff',
                        'neon-purple': '#8a2be2',
                        'matrix-green': '#00ff9f',
                        'critical-red': '#ff0055',
                        'warning-amber': '#ffaa00'
                    },
                    fontFamily: {
                        'space': ['Space Grotesk', 'sans-serif'],
                        'jakarta': ['Plus Jakarta Sans', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/futuristic-theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative;">
        <div class="glass-card glass-card-dark" style="max-width: 420px; width: 100%; border-color: rgba(255, 215, 0, 0.2);">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; background: rgba(255, 215, 0, 0.1); border: 1px solid gold; border-radius: 50%; margin-bottom: 1rem; box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);">
                    <i data-lucide="shield-alert" style="width: 32px; height: 32px; color: gold;"></i>
                </div>
                <div style="display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                    <span class="neon-badge neon-badge-warning" style="font-size: 0.7rem;">CLEARANCE LEVEL 5</span>
                </div>
                <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.75rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-primary);">Command Access</h1>
                <p style="color: var(--text-secondary); font-size: 0.95rem;">Admin Portal Authentication</p>
            </div>

            <div id="rate-limit-banner" class="rate-limit-banner">
                <h4>
                    <i data-lucide="alert-triangle" style="width: 18px; height: 18px;"></i>
                    SECURITY LOCKOUT
                </h4>
                <p style="color: var(--text-secondary); margin-bottom: 0.5rem;">Too many authentication attempts detected</p>
                <div class="hud-timer" id="rate-limit-timer">60</div>
                <p style="font-size: 0.875rem; color: var(--text-muted);">seconds until retry available</p>
            </div>

            <form id="loginForm">
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-secondary); font-size: 0.9rem;">Admin Email</label>
                    <input type="email" id="email" name="email" class="cyber-input" required placeholder="admin@nexusmart.com">
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-secondary); font-size: 0.9rem;">Security Key</label>
                    <input type="password" id="password" name="password" class="cyber-input" required placeholder="••••••••">
                </div>

                <div id="error" style="color: var(--critical-red); font-size: 0.875rem; margin-bottom: 1rem; display: none; padding: 0.75rem; background: rgba(255, 0, 85, 0.1); border: 1px solid var(--critical-red); border-radius: 8px;"></div>

                <button type="submit" id="submitBtn" class="cyber-button" style="width: 100%; background: linear-gradient(135deg, gold, #ffaa00);">
                    <span style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                        <i data-lucide="terminal" style="width: 18px; height: 18px;"></i>
                        Access Command
                    </span>
                </button>
            </form>

            <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--surface-border);">
                <p style="text-align: center; color: var(--text-secondary); font-size: 0.9rem;">
                    Regular user access? 
                    <a href="/login.html" style="color: var(--quantum-cyan); text-decoration: none; font-weight: 500; transition: color 0.3s ease;">User Portal →</a>
                </p>
                <p style="text-align: center; margin-top: 0.75rem;">
                    <a href="/index.html" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">← Return to Nexus Hub</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module" src="/js/config.js"></script>
    <script type="module" src="/js/toast.js"></script>
    <script type="module" src="/js/api-client.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module">
        import apiClient from './js/api-client.js';
        import authManager from './js/auth.js';
        import toastManager from './js/toast.js';

        const loginForm = document.getElementById('loginForm');
        const errorDiv = document.getElementById('error');
        const rateLimitBanner = document.getElementById('rate-limit-banner');
        const rateLimitTimer = document.getElementById('rate-limit-timer');
        const submitBtn = document.getElementById('submitBtn');

        let rateLimitInterval = null;

        window.addEventListener('rate-limit-triggered', (e) => {
            const retryAfter = e.detail.retryAfter;
            activateRateLimit(retryAfter);
        });

        function activateRateLimit(seconds) {
            rateLimitBanner.classList.add('active');
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.5';
            submitBtn.style.cursor = 'not-allowed';
            
            let remaining = seconds;
            rateLimitTimer.textContent = remaining;

            if (rateLimitInterval) clearInterval(rateLimitInterval);

            rateLimitInterval = setInterval(() => {
                remaining--;
                rateLimitTimer.textContent = remaining;

                if (remaining <= 0) {
                    clearInterval(rateLimitInterval);
                    rateLimitBanner.classList.remove('active');
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.style.cursor = 'pointer';
                }
            }, 1000);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            errorDiv.style.display = 'none';

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;"><div class="loading-spinner" style="width: 18px; height: 18px; border-width: 2px; border-color: gold;"></div> Authenticating...</span>';

            try {
                const response = await apiClient.login({ email, password });

                if (response.role !== 'ROLE_ADMIN' && response.role !== 'ADMIN') {
                    throw new Error('Access Denied: Insufficient clearance level');
                }

                authManager.setUser({
                    id: response.userId,
                    email: response.email,
                    name: response.name,
                    role: response.role
                }, response.token);

                toastManager.success('Command Access Granted', 'Welcome to Mission Control');
                setTimeout(() => {
                    window.location.href = '/admin.html';
                }, 1000);
            } catch (err) {
                if (err.message.includes('Rate limit') || err.message.includes('429')) {
                    activateRateLimit(60);
                } else {
                    errorDiv.textContent = err.message;
                    errorDiv.style.display = 'block';
                }
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;"><i data-lucide="terminal" style="width: 18px; height: 18px;"></i> Access Command</span>';
                lucide.createIcons();
            }
        });

        lucide.createIcons();
    </script>
</body>
</html>
