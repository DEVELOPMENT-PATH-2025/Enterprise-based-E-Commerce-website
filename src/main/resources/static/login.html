<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NexusMart</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f9fafb; padding: 1rem;">
        <div class="card" style="max-width: 400px; width: 100%;">
            <h1 style="text-align: center; margin-bottom: 1.5rem;">Sign in to NexusMart</h1>
            <p style="text-align: center; color: #6b7280; margin-bottom: 1.5rem;">Enterprise E-Commerce Platform</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div id="error" class="error-message hidden"></div>
                <div id="rateLimit" class="error-message hidden" style="background-color: #fef3c7; color: #d97706; padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 1rem;"></div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign in</button>
            </form>
            
            <p style="text-align: center; margin-top: 1.5rem; color: #6b7280;">
                Don't have an account? <a href="/register.html" style="color: #2563eb;">Register</a>
            </p>
        </div>
    </div>

    <script src="/js/api-client.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const errorDiv = document.getElementById('error');
        const rateLimitDiv = document.getElementById('rateLimit');
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            errorDiv.classList.add('hidden');
            rateLimitDiv.classList.add('hidden');
            
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
            
            try {
                const response = await apiClient.login({ email, password });
                
                authManager.setUser({
                    id: response.userId,
                    email: response.email,
                    name: response.name,
                    role: response.role
                });
                
                apiClient.setToken(response.token);
                
                window.location.href = '/index.html';
            } catch (err) {
                if (err.message.includes('429') || err.message.includes('Too Many Requests')) {
                    let cooldown = 60;
                    rateLimitDiv.textContent = `Too many login attempts. Please wait ${cooldown} seconds before trying again.`;
                    rateLimitDiv.classList.remove('hidden');
                    
                    const interval = setInterval(() => {
                        cooldown--;
                        if (cooldown <= 0) {
                            clearInterval(interval);
                            rateLimitDiv.classList.add('hidden');
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Sign in';
                        } else {
                            rateLimitDiv.textContent = `Too many login attempts. Please wait ${cooldown} seconds before trying again.`;
                        }
                    }, 1000);
                } else {
                    errorDiv.textContent = err.message;
                    errorDiv.classList.remove('hidden');
                }
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
