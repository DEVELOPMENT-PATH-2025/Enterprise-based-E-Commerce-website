<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Command Center - NexusMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#050813',
                        'surface-1': 'rgba(13, 20, 36, 0.7)',
                        'surface-2': 'rgba(20, 30, 50, 0.8)',
                        'quantum-cyan': '#00f0ff',
                        'neon-purple': '#8a2be2',
                        'matrix-green': '#00ff9f',
                        'critical-red': '#ff0055',
                        'warning-amber': '#ffaa00'
                    },
                    fontFamily: {
                        'space': ['Space Grotesk', 'sans-serif'],
                        'jakarta': ['Plus Jakarta Sans', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/futuristic-theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar navbar-default">
        <div class="container navbar-content">
            <a href="/index.html" class="navbar-brand">
                <span class="navbar-logo">NEXUS MART</span>
            </a>
            <div class="navbar-links" id="authLinks"></div>
        </div>
    </nav>

    <main class="container" style="margin-top: 2rem;">
        <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
            <i data-lucide="user-circle" style="width: 32px; height: 32px; color: var(--quantum-cyan);"></i>
            <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 600; color: var(--text-primary);">User Command Center</h1>
        </div>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Welcome back, <span id="userName" style="color: var(--quantum-cyan); font-weight: 600;"></span></p>
        
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
            <div class="glass-card">
                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
                    <div style="width: 72px; height: 72px; background: linear-gradient(135deg, var(--quantum-cyan), var(--neon-purple)); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);">
                        <i data-lucide="user" style="width: 36px; height: 36px; color: white;"></i>
                    </div>
                    <div>
                        <h3 id="userNameCard" style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: var(--text-primary);"></h3>
                        <p id="userEmail" style="color: var(--text-secondary); font-size: 0.875rem;"></p>
                    </div>
                </div>
                
                <div style="border-top: 1px solid var(--surface-border); padding-top: 1rem;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.75rem;">
                        <span>Clearance Level:</span>
                        <span id="userRole" style="font-weight: 600; color: var(--quantum-cyan);"></span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.75rem;">
                        <span>Member Since:</span>
                        <span id="memberSince" style="font-family: 'JetBrains Mono', monospace;"></span>
                    </div>
                </div>
                
                <button onclick="window.authManager.logout()" class="cyber-button-secondary" style="width: 100%; margin-top: 1.5rem;">
                    <i data-lucide="log-out" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                    Terminate Session
                </button>
            </div>
            
            <div class="glass-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; font-weight: 600; color: var(--text-primary);">
                        <i data-lucide="package" style="width: 20px; height: 20px; color: var(--quantum-cyan); display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                        Order History
                    </h3>
                    <button onclick="window.loadOrders()" class="cyber-button-secondary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
                        <i data-lucide="refresh-cw" style="width: 14px; height: 14px; display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                        Refresh
                    </button>
                </div>
                <div id="loading" style="display: none; text-align: center; padding: 2rem; color: var(--text-secondary);">
                    <div class="loading-spinner" style="margin: 0 auto 1rem;"></div>
                    Loading orders...
                </div>
                <div id="error" class="glass-card" style="display: none; border-color: var(--critical-red); margin-bottom: 1rem;"></div>
                <div id="orders"></div>
                <div id="noOrders" style="display: none; text-align: center; padding: 3rem;">
                    <div style="display: inline-flex; align-items: center; justify-content: center; width: 80px; height: 80px; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--quantum-cyan); border-radius: 50%; margin-bottom: 1rem;">
                        <i data-lucide="shopping-bag" style="width: 40px; height: 40px; color: var(--quantum-cyan);"></i>
                    </div>
                    <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">No orders yet</p>
                    <a href="/index.html" class="cyber-button">
                        <i data-lucide="shopping-bag" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                        Start Shopping
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/js/config.js"></script>
    <script type="module" src="/js/toast.js"></script>
    <script type="module" src="/js/api-client.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module">
        import authManager from './js/auth.js';
        import apiClient from './js/api-client.js';
        import toastManager from './js/toast.js';

        window.authManager = authManager;

        if (!authManager.isAuthenticated()) {
            window.location.href = '/login.html';
        }

        const user = authManager.getUser();
        document.getElementById('userName').textContent = user.name;
        document.getElementById('userNameCard').textContent = user.name;
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('userRole').textContent = user.role === 'ROLE_ADMIN' ? 'Administrator (Level 5)' : 'Customer (Level 1)';
        document.getElementById('memberSince').textContent = new Date().toLocaleDateString();

        window.loadOrders = async () => {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const ordersDiv = document.getElementById('orders');
            const noOrders = document.getElementById('noOrders');
            
            loading.style.display = 'block';
            error.style.display = 'none';
            
            try {
                const orders = await apiClient.getOrders();
                
                if (orders.length === 0) {
                    noOrders.style.display = 'block';
                    ordersDiv.style.display = 'none';
                } else {
                    noOrders.style.display = 'none';
                    ordersDiv.style.display = 'block';
                    
                    ordersDiv.innerHTML = orders.map((order, index) => `
                        <div class="order-card-futuristic" style="animation-delay: ${index * 0.1}s;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--surface-border);">
                                <div>
                                    <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; color: var(--text-muted);">ORD-${order.id.slice(0, 8).toUpperCase()}</div>
                                    <div style="font-size: 0.875rem; color: var(--text-secondary);">${new Date(order.createdAt).toLocaleDateString()}</div>
                                </div>
                                <span class="order-status-futuristic order-status-${order.status.toLowerCase()}">${order.status}</span>
                            </div>
                            
                            <div style="margin-bottom: 1rem;">
                                ${order.items.map(item => `
                                    <div style="display: flex; justify-content: space-between; font-size: 0.875rem; margin-bottom: 0.5rem; color: var(--text-secondary);">
                                        <span>${item.productName} x ${item.quantity}</span>
                                        <span style="color: var(--text-primary); font-weight: 600;">$${(item.priceSnapshot * item.quantity).toFixed(2)}</span>
                                    </div>
                                `).join('')}
                            </div>
                            
                            <div style="display: flex; justify-content: space-between; padding-top: 1rem; border-top: 1px solid var(--surface-border);">
                                <span style="color: var(--text-secondary);">Total</span>
                                <span style="font-weight: 700; color: var(--quantum-cyan); font-size: 1.1rem;">$${order.totalAmount.toFixed(2)}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                error.innerHTML = `<p style="color: var(--critical-red);">${err.message}</p>`;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        };

        loadOrders();
        lucide.createIcons();
    </script>
</body>
</html>
