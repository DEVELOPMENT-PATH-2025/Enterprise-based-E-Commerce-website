<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Cart - NexusMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#050813',
                        'surface-1': 'rgba(13, 20, 36, 0.7)',
                        'surface-2': 'rgba(20, 30, 50, 0.8)',
                        'quantum-cyan': '#00f0ff',
                        'neon-purple': '#8a2be2',
                        'matrix-green': '#00ff9f',
                        'critical-red': '#ff0055',
                        'warning-amber': '#ffaa00'
                    },
                    fontFamily: {
                        'space': ['Space Grotesk', 'sans-serif'],
                        'jakarta': ['Plus Jakarta Sans', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/futuristic-theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar navbar-default">
        <div class="container navbar-content">
            <a href="/index.html" class="navbar-brand">
                <span class="navbar-logo">NEXUS MART</span>
            </a>
            <div class="navbar-links" id="authLinks"></div>
        </div>
    </nav>

    <main class="container" style="margin-top: 2rem;">
        <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem;">
            <i data-lucide="shopping-cart" style="width: 32px; height: 32px; color: var(--quantum-cyan);"></i>
            <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 600; color: var(--text-primary);">Holographic Cart</h1>
        </div>
        
        <div id="emptyCart" class="glass-card" style="display: none; text-align: center; padding: 4rem 2rem;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 80px; height: 80px; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--quantum-cyan); border-radius: 50%; margin-bottom: 1.5rem;">
                <i data-lucide="shopping-bag" style="width: 40px; height: 40px; color: var(--quantum-cyan);"></i>
            </div>
            <h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem;">Cart Empty</h3>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Your holographic cart is currently empty</p>
            <a href="/index.html" class="cyber-button">
                <i data-lucide="shopping-bag" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                Browse Products
            </a>
        </div>
        
        <div id="cartContent" style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
            <div class="glass-card">
                <div id="cartItems"></div>
            </div>
            
            <div class="glass-card" style="position: sticky; top: 5rem;">
                <h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-primary);">
                    <i data-lucide="receipt" style="width: 20px; height: 20px; color: var(--quantum-cyan); display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                    Order Summary
                </h3>
                <div id="cartSummary"></div>
                <a href="/checkout.html" class="cyber-button" style="width: 100%; display: block; text-align: center; margin-top: 1.5rem;">
                    <i data-lucide="credit-card" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                    Proceed to Checkout
                </a>
                <button onclick="window.clearCart()" class="cyber-button-secondary" style="width: 100%; margin-top: 0.75rem;">
                    <i data-lucide="trash-2" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                    Clear Cart
                </button>
            </div>
        </div>
    </main>

    <script type="module" src="/js/config.js"></script>
    <script type="module" src="/js/toast.js"></script>
    <script type="module" src="/js/api-client.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/cart.js"></script>
    <script type="module">
        import authManager from './js/auth.js';
        import cartManager from './js/cart.js';
        import toastManager from './js/toast.js';

        window.cartManager = cartManager;

        if (!authManager.isAuthenticated()) {
            window.location.href = '/login.html';
        }

        function renderCart() {
            const emptyCart = document.getElementById('emptyCart');
            const cartContent = document.getElementById('cartContent');
            const cartItems = document.getElementById('cartItems');
            const cartSummary = document.getElementById('cartSummary');
            
            if (cartManager.items.length === 0) {
                emptyCart.style.display = 'block';
                cartContent.style.display = 'none';
                return;
            }
            
            emptyCart.style.display = 'none';
            cartContent.style.display = 'grid';
            
            cartItems.innerHTML = cartManager.items.map((item, index) => `
                <div class="cart-item-futuristic" style="animation-delay: ${index * 0.1}s;">
                    <img src="${item.imageUrl || 'https://via.placeholder.com/100'}" alt="${item.productName}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid var(--surface-border);">
                    <div style="flex: 1; padding: 0 1rem;">
                        <div style="font-weight: 600; color: var(--text-primary); margin-bottom: 0.25rem;">${item.productName}</div>
                        <div style="font-size: 0.9rem; color: var(--quantum-cyan); font-weight: 700;">$${item.price.toFixed(2)}</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <button onclick="window.updateQuantity('${item.productId}', ${item.quantity - 1})" class="quantity-btn-futuristic">-</button>
                        <span id="qty-${item.productId}" style="font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--text-primary); min-width: 30px; text-align: center;">${item.quantity}</span>
                        <button onclick="window.updateQuantity('${item.productId}', ${item.quantity + 1})" class="quantity-btn-futuristic">+</button>
                    </div>
                    <div id="total-${item.productId}" style="font-weight: 700; color: var(--quantum-cyan); font-size: 1.1rem; min-width: 80px; text-align: right;">$${(item.price * item.quantity).toFixed(2)}</div>
                    <button onclick="window.removeItem('${item.productId}')" class="delete-btn">
                        <i data-lucide="x" style="width: 18px; height: 18px;"></i>
                    </button>
                </div>
            `).join('');
            
            cartSummary.innerHTML = `
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--surface-border);">
                    <span style="color: var(--text-secondary);">Subtotal (${cartManager.getTotalItems()} items)</span>
                    <span id="subtotal" style="font-weight: 600; color: var(--text-primary);">$${cartManager.getTotalPrice().toFixed(2)}</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; color: var(--text-muted);">
                    <span>Shipping</span>
                    <span style="color: var(--matrix-green);">Free</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; color: var(--text-muted);">
                    <span>Tax</span>
                    <span>Calculated at checkout</span>
                </div>
                <div style="border-top: 1px solid var(--surface-border); padding-top: 1rem; margin-top: 0.75rem; display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 700;">
                    <span style="color: var(--text-primary);">Total</span>
                    <span id="grandTotal" style="color: var(--quantum-cyan);">$${cartManager.getTotalPrice().toFixed(2)}</span>
                </div>
            `;
        }

        window.updateQuantity = (productId, newQuantity) => {
            if (newQuantity < 1) return;
            cartManager.updateQuantity(productId, newQuantity);
            renderCart();
        };

        window.removeItem = (productId) => {
            cartManager.removeItem(productId);
            toastManager.success('Item Removed', 'Product removed from cart');
            renderCart();
        };

        window.clearCart = () => {
            cartManager.clearCart();
            toastManager.success('Cart Cleared', 'All items have been removed from your cart');
            renderCart();
        };

        renderCart();
        lucide.createIcons();
    </script>
</body>
</html>
