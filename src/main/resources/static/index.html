<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusMart - Enterprise E-Commerce</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/index.html" class="navbar-brand">NexusMart</a>
            <div class="navbar-links" id="authLinks">
                <a href="/login.html">Sign In</a>
                <a href="/register.html" class="btn btn-primary">Register</a>
            </div>
        </div>
    </nav>

    <main class="container" style="margin-top: 2rem;">
        <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
            <input type="text" id="searchInput" placeholder="Search products..." 
                   style="flex: 1; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem;">
            <button onclick="searchProducts()" class="btn btn-primary">Search</button>
        </div>

        <h1>Featured Products</h1>
        <div id="products" class="product-grid"></div>
        <div id="loading" class="text-center hidden">Loading products...</div>
        <div id="error" class="error-message hidden"></div>
    </main>

    <script src="/js/api-client.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
    <script>
        async function loadProducts() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const productsDiv = document.getElementById('products');
            
            loading.classList.remove('hidden');
            error.classList.add('hidden');
            
            try {
                const response = await apiClient.getProducts({ page: 0, size: 12 });
                displayProducts(response.content);
            } catch (err) {
                error.textContent = err.message;
                error.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }

        async function searchProducts() {
            const query = document.getElementById('searchInput').value;
            if (!query.trim()) {
                loadProducts();
                return;
            }
            
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const productsDiv = document.getElementById('products');
            
            loading.classList.remove('hidden');
            error.classList.add('hidden');
            
            try {
                const products = await apiClient.searchProducts(query);
                displayProducts(products);
            } catch (err) {
                error.textContent = err.message;
                error.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }

        function displayProducts(products) {
            const productsDiv = document.getElementById('products');
            
            if (products.length === 0) {
                productsDiv.innerHTML = '<p class="text-center animate-fade-in">No products found</p>';
                return;
            }
            
            productsDiv.innerHTML = products.map((product, index) => `
                <div class="product-card animate-fade-in" style="animation-delay: ${index * 0.1}s;" onclick="viewProduct('${product.id}')">
                    <div style="position: relative; overflow: hidden;">
                        <img src="${product.imageUrl || '/images/placeholder.png'}" alt="${product.name}" class="product-image">
                        ${product.stock < 5 && product.stock > 0 ? '<span style="position: absolute; top: 10px; right: 10px; background: #fef3c7; color: #d97706; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600;">Low Stock</span>' : ''}
                        ${product.stock === 0 ? '<span style="position: absolute; top: 10px; right: 10px; background: #fee2e2; color: #dc2626; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600;">Out of Stock</span>' : ''}
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-description">${product.description}</p>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
                            <p class="product-price">$${product.price.toFixed(2)}</p>
                            <p class="product-stock">${product.stock > 0 ? `${product.stock} available` : 'Out of stock'}</p>
                        </div>
                        <button onclick="event.stopPropagation(); addToCart('${product.id}', '${product.name}', ${product.price}, '${product.imageUrl}', ${product.stock})" 
                                class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;"
                                ${product.stock === 0 ? 'disabled' : ''}>
                            ${product.stock > 0 ? 'Add to Cart' : 'Out of Stock'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function viewProduct(productId) {
            // Navigate to product detail page (to be implemented)
            console.log('View product:', productId);
        }

        function addToCart(productId, productName, price, imageUrl, stock) {
            if (stock === 0) return;
            
            cartManager.addItem({
                id: productId,
                name: productName,
                price: price,
                imageUrl: imageUrl
            });
            
            // Show toast notification
            showToast('Added to cart!', 'success');
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type} animate-fade-in`;
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: ${type === 'success' ? '#059669' : '#dc2626'};
                color: white;
                padding: 1rem 1.5rem;
                border-radius: 0.5rem;
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
                z-index: 1000;
                animation: slideIn 0.3s ease-out;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease-out forwards';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchProducts();
            }
        });

        loadProducts();
    </script>
</body>
</html>
