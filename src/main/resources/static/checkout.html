<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Terminal - NexusMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#050813',
                        'surface-1': 'rgba(13, 20, 36, 0.7)',
                        'surface-2': 'rgba(20, 30, 50, 0.8)',
                        'quantum-cyan': '#00f0ff',
                        'neon-purple': '#8a2be2',
                        'matrix-green': '#00ff9f',
                        'critical-red': '#ff0055',
                        'warning-amber': '#ffaa00'
                    },
                    fontFamily: {
                        'space': ['Space Grotesk', 'sans-serif'],
                        'jakarta': ['Plus Jakarta Sans', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/futuristic-theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar navbar-default">
        <div class="container navbar-content">
            <a href="/index.html" class="navbar-brand">
                <span class="navbar-logo">NEXUS MART</span>
            </a>
            <div class="navbar-links" id="authLinks"></div>
        </div>
    </nav>

    <main class="container" style="margin-top: 2rem;">
        <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem;">
            <i data-lucide="credit-card" style="width: 32px; height: 32px; color: var(--quantum-cyan);"></i>
            <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 600; color: var(--text-primary);">Stripe Terminal</h1>
        </div>
        
        <div id="emptyCart" class="glass-card" style="display: none; text-align: center; padding: 4rem 2rem;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 80px; height: 80px; background: rgba(255, 0, 85, 0.1); border: 1px solid var(--critical-red); border-radius: 50%; margin-bottom: 1.5rem;">
                <i data-lucide="shopping-cart" style="width: 40px; height: 40px; color: var(--critical-red);"></i>
            </div>
            <h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem;">Cart Empty</h3>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Your cart is empty. Add items before checkout.</p>
            <a href="/index.html" class="cyber-button">
                <i data-lucide="shopping-bag" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                Browse Products
            </a>
        </div>
        
        <div id="checkoutContent" style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
            <div class="glass-card">
                <h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-primary);">
                    <i data-lucide="check-circle" style="width: 20px; height: 20px; color: var(--matrix-green); display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                    Direct Checkout
                </h3>
                <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Complete your purchase instantly. Demo mode - payment bypassed.</p>
                
                <button onclick="window.placeOrder()" id="placeOrderBtn" class="cyber-button" style="width: 100%;">
                    <i data-lucide="shopping-bag" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                    Complete Purchase
                </button>
            </div>
            
            <div class="glass-card" style="position: sticky; top: 5rem;">
                <h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-primary);">
                    <i data-lucide="receipt" style="width: 20px; height: 20px; color: var(--quantum-cyan); display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                    Order Summary
                </h3>
                <div id="cartSummary"></div>
            </div>
        </div>
    </main>

    <script type="module" src="/js/config.js"></script>
    <script type="module" src="/js/toast.js"></script>
    <script type="module" src="/js/api-client.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/cart.js"></script>
    <script type="module">
        import authManager from './js/auth.js';
        import cartManager from './js/cart.js';
        import apiClient from './js/api-client.js';
        import toastManager from './js/toast.js';

        if (!authManager.isAuthenticated()) {
            window.location.href = '/login.html';
        }

        if (cartManager.items.length === 0) {
            document.getElementById('emptyCart').style.display = 'block';
            document.getElementById('checkoutContent').style.display = 'none';
        }

        function renderSummary() {
            const cartSummary = document.getElementById('cartSummary');
            cartSummary.innerHTML = `
                <div style="margin-bottom: 1rem;">
                    ${cartManager.items.map(item => `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-secondary);">
                            <span>${item.productName} x ${item.quantity}</span>
                            <span style="color: var(--text-primary); font-weight: 600;">$${(item.price * item.quantity).toFixed(2)}</span>
                        </div>
                    `).join('')}
                </div>
                <div style="border-top: 1px solid var(--surface-border); padding-top: 1rem; margin-top: 1rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; color: var(--text-secondary);">
                        <span>Subtotal</span>
                        <span style="color: var(--text-primary);">$${cartManager.getTotalPrice().toFixed(2)}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; color: var(--text-muted);">
                        <span>Shipping</span>
                        <span style="color: var(--matrix-green);">Free</span>
                    </div>
                    <div style="border-top: 1px solid var(--surface-border); padding-top: 1rem; margin-top: 0.75rem; display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 700;">
                        <span style="color: var(--text-primary);">Total</span>
                        <span style="color: var(--quantum-cyan);">$${cartManager.getTotalPrice().toFixed(2)}</span>
                    </div>
                </div>
            `;
        }

        window.placeOrder = async () => {
            const placeOrderBtn = document.getElementById('placeOrderBtn');
            placeOrderBtn.disabled = true;
            placeOrderBtn.innerHTML = '<div class="loading-spinner" style="width: 18px; height: 18px; border-width: 2px; display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></div> Processing...';
            
            try {
                const checkoutRequest = {
                    items: cartManager.items.map(item => ({
                        productId: item.productId,
                        quantity: item.quantity
                    }))
                };
                
                const response = await apiClient.checkout(checkoutRequest);
                
                cartManager.clearCart();
                window.location.href = `/checkout-success.html?order_id=${response.id}`;
            } catch (err) {
                toastManager.error('Checkout Failed', err.message || 'Failed to place order');
                placeOrderBtn.disabled = false;
                placeOrderBtn.innerHTML = '<i data-lucide="shopping-bag" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i> Complete Purchase';
                lucide.createIcons();
            }
        };

        renderSummary();
        lucide.createIcons();
    </script>
</body>
</html>
