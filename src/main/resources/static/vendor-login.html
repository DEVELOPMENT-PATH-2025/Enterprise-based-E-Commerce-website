<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Sign In - NexusMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#050813',
                        'surface-1': 'rgba(13, 20, 36, 0.7)',
                        'surface-2': 'rgba(20, 30, 50, 0.8)',
                        'quantum-cyan': '#00f0ff',
                        'neon-purple': '#8a2be2',
                        'matrix-green': '#00ff9f',
                        'critical-red': '#ff0055',
                        'warning-amber': '#ffaa00'
                    },
                    fontFamily: {
                        'space': ['Space Grotesk', 'sans-serif'],
                        'jakarta': ['Plus Jakarta Sans', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/futuristic-theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-void via-slate-900 to-void">
    <nav class="navbar">
        <div class="container navbar-content">
            <a href="/index.html" class="navbar-brand">
                <span class="navbar-logo">NEXUSMART</span>
                <span class="navbar-badge navbar-badge-cyan">[ MERCHANT PORTAL ]</span>
            </a>
            <div class="navbar-links">
                <a href="/index.html" class="navbar-link">Return to Storefront</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 500px; margin-top: 4rem;">
        <div class="glass-card">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-cyan-500/20 to-purple-500/20 border border-cyan-500/30 mb-4">
                    <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2 font-space">Vendor Sign In</h1>
                <p class="text-slate-400">Access your merchant dashboard and manage inventory</p>
            </div>

            <form id="vendorLoginForm" onsubmit="handleVendorLogin(event)">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                    <input type="email" id="login-email" name="email" required
                           class="w-full bg-slate-800/80 border border-slate-700/60 text-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-500/50 transition"
                           placeholder="yourname@gmail.com">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                    <input type="password" id="login-password" name="password" required
                           class="w-full bg-slate-800/80 border border-slate-700/60 text-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-500/50 transition"
                           placeholder="Enter your password">
                </div>

                <button type="submit" id="btn-vendor-login"
                        class="w-full py-3 px-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white rounded-lg font-bold shadow-lg shadow-cyan-500/20 transition-all duration-150 active:scale-95">
                    Sign In to Portal →
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-700/60 text-center space-y-3">
                <p class="text-sm text-slate-400">
                    New seller? <a href="/vendor-register.html" class="text-cyan-400 hover:underline">Create a store</a>
                </p>
                <p class="text-sm text-slate-400">
                    <a href="/index.html" class="text-slate-500 hover:text-slate-300">Return to Storefront</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module" src="/js/toast.js"></script>
    <script type="module">
        import toastManager from './js/toast.js';

        async function handleVendorLogin(event) {
            event.preventDefault();
            const form = event.target;
            const email = form.email.value.trim();
            const password = form.password.value;

            const submitBtn = document.getElementById('btn-vendor-login');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                const response = await fetch('http://localhost:8080/api/v1/vendor/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || 'Failed to sign in');
                }

                const data = await response.json();

                // Save token and user to localStorage
                localStorage.setItem('nexusmart_token', data.token);
                localStorage.setItem('nexusmart_user', JSON.stringify(data.user));

                toastManager.success('Welcome back!', 'Redirecting to dashboard...');

                // Immediate redirect to vendor dashboard
                setTimeout(() => {
                    window.location.href = '/vendor-dashboard.html';
                }, 1000);
            } catch (err) {
                toastManager.error('Sign In Failed', err.message || 'Failed to sign in');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In to Portal →';
            }
        }

        window.handleVendorLogin = handleVendorLogin;

        // Initialize icons
        lucide.createIcons();
    </script>
</body>
</html>
