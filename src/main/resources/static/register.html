<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initialize Account - NexusMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#050813',
                        'surface-1': 'rgba(13, 20, 36, 0.7)',
                        'surface-2': 'rgba(20, 30, 50, 0.8)',
                        'quantum-cyan': '#00f0ff',
                        'neon-purple': '#8a2be2',
                        'matrix-green': '#00ff9f',
                        'critical-red': '#ff0055',
                        'warning-amber': '#ffaa00'
                    },
                    fontFamily: {
                        'space': ['Space Grotesk', 'sans-serif'],
                        'jakarta': ['Plus Jakarta Sans', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/futuristic-theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative;">
        <div class="glass-card" style="max-width: 440px; width: 100%;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--quantum-cyan); border-radius: 50%; margin-bottom: 1rem; box-shadow: 0 0 20px var(--quantum-cyan-glow);">
                    <i data-lucide="user-plus" style="width: 32px; height: 32px; color: var(--quantum-cyan);"></i>
                </div>
                <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.75rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-primary);">Initialize Account</h1>
                <p style="color: var(--text-secondary); font-size: 0.95rem;">Join the NexusMart quantum network</p>
            </div>

            <div id="rate-limit-banner" class="rate-limit-banner">
                <h4>
                    <i data-lucide="alert-triangle" style="width: 18px; height: 18px;"></i>
                    SECURITY LOCKOUT
                </h4>
                <p style="color: var(--text-secondary); margin-bottom: 0.5rem;">Too many registration attempts detected</p>
                <div class="hud-timer" id="rate-limit-timer">60</div>
                <p style="font-size: 0.875rem; color: var(--text-muted);">seconds until retry available</p>
            </div>

            <form id="registerForm">
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-secondary); font-size: 0.9rem;">Full Name</label>
                    <input type="text" id="name" name="name" class="cyber-input" required placeholder="Enter your name" minlength="2">
                </div>

                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-secondary); font-size: 0.9rem;">Email Address</label>
                    <input type="email" id="email" name="email" class="cyber-input" required placeholder="user@nexusmart.com">
                </div>

                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-secondary); font-size: 0.9rem;">Password</label>
                    <input type="password" id="password" name="password" class="cyber-input" required placeholder="••••••••" minlength="8">
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-secondary); font-size: 0.9rem;">Account Type</label>
                    <select id="role" name="role" class="cyber-select">
                        <option value="ROLE_CUSTOMER" selected>CUSTOMER (Default)</option>
                        <option value="ROLE_ADMIN">ADMINISTRATOR</option>
                    </select>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem;">Select Administrator only if you have elevated clearance.</p>
                </div>

                <div id="error" style="color: var(--critical-red); font-size: 0.875rem; margin-bottom: 1rem; display: none; padding: 0.75rem; background: rgba(255, 0, 85, 0.1); border: 1px solid var(--critical-red); border-radius: 8px;"></div>

                <button type="submit" id="submitBtn" class="cyber-button" style="width: 100%;">
                    <span style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                        <i data-lucide="rocket" style="width: 18px; height: 18px;"></i>
                        Initialize Account
                    </span>
                </button>
            </form>

            <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--surface-border);">
                <div style="margin-bottom: 1rem;">
                    <button type="button" id="googleSignUpBtn" class="cyber-button-secondary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
                        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        Sign up with Google
                    </button>
                </div>
                <p style="text-align: center; color: var(--text-secondary); font-size: 0.9rem;">
                    Already initialized? 
                    <a href="/login.html" style="color: var(--quantum-cyan); text-decoration: none; font-weight: 500; transition: color 0.3s ease;">Authenticate →</a>
                </p>
                <p style="text-align: center; margin-top: 0.75rem;">
                    <a href="/index.html" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">← Return to Nexus Hub</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module" src="/js/config.js"></script>
    <script type="module" src="/js/toast.js"></script>
    <script type="module" src="/js/api-client.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module">
        import apiClient from './js/api-client.js';
        import authManager from './js/auth.js';
        import toastManager from './js/toast.js';

        const registerForm = document.getElementById('registerForm');
        const errorDiv = document.getElementById('error');
        const rateLimitBanner = document.getElementById('rate-limit-banner');
        const rateLimitTimer = document.getElementById('rate-limit-timer');
        const submitBtn = document.getElementById('submitBtn');

        let rateLimitInterval = null;

        window.addEventListener('rate-limit-triggered', (e) => {
            const retryAfter = e.detail.retryAfter;
            activateRateLimit(retryAfter);
        });

        function activateRateLimit(seconds) {
            rateLimitBanner.classList.add('active');
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.5';
            submitBtn.style.cursor = 'not-allowed';
            
            let remaining = seconds;
            rateLimitTimer.textContent = remaining;

            if (rateLimitInterval) clearInterval(rateLimitInterval);

            rateLimitInterval = setInterval(() => {
                remaining--;
                rateLimitTimer.textContent = remaining;

                if (remaining <= 0) {
                    clearInterval(rateLimitInterval);
                    rateLimitBanner.classList.remove('active');
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.style.cursor = 'pointer';
                }
            }, 1000);
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            errorDiv.style.display = 'none';

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;"><div class="loading-spinner" style="width: 18px; height: 18px; border-width: 2px;"></div> Initializing...</span>';

            try {
                const response = await apiClient.register({ name, email, password, role });

                authManager.setUser({
                    id: response.userId,
                    email: response.email,
                    name: response.name,
                    role: response.role
                }, response.token);

                toastManager.success('Account Initialized', 'Welcome to NexusMart');
                setTimeout(() => {
                    if (role === 'ROLE_ADMIN') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                }, 1000);
            } catch (err) {
                if (err.message.includes('Rate limit') || err.message.includes('429')) {
                    activateRateLimit(60);
                } else {
                    errorDiv.textContent = err.message;
                    errorDiv.style.display = 'block';
                }
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;"><i data-lucide="rocket" style="width: 18px; height: 18px;"></i> Initialize Account</span>';
                lucide.createIcons();
            }
        });

        lucide.createIcons();
    </script>
</body>
</html>
