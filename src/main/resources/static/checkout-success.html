<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Receipt - NexusMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#050813',
                        'surface-1': 'rgba(13, 20, 36, 0.7)',
                        'surface-2': 'rgba(20, 30, 50, 0.8)',
                        'quantum-cyan': '#00f0ff',
                        'neon-purple': '#8a2be2',
                        'matrix-green': '#00ff9f',
                        'critical-red': '#ff0055',
                        'warning-amber': '#ffaa00'
                    },
                    fontFamily: {
                        'space': ['Space Grotesk', 'sans-serif'],
                        'jakarta': ['Plus Jakarta Sans', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/futuristic-theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass-card glass-card-dark" style="max-width: 500px; width: 100%; text-align: center; border-color: rgba(0, 255, 159, 0.3);">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 100px; height: 100px; background: rgba(0, 255, 159, 0.1); border: 2px solid var(--matrix-green); border-radius: 50%; margin: 0 auto 2rem; box-shadow: 0 0 30px rgba(0, 255, 159, 0.3);">
            <i data-lucide="check-circle-2" style="width: 50px; height: 50px; color: var(--matrix-green);"></i>
        </div>

        <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.75rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-primary);">Transaction Complete</h1>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Your payment has been processed successfully. Order confirmation sent.</p>

        <div style="background: rgba(0, 240, 255, 0.05); border: 1px solid var(--quantum-cyan); border-radius: 8px; padding: 1rem; margin-bottom: 2rem;">
            <div style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 0.5rem;">Order ID</div>
            <div id="orderId" style="color: var(--quantum-cyan); font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 600;"></div>
        </div>

        <div style="background: rgba(0, 255, 159, 0.05); border: 1px solid var(--matrix-green); border-radius: 8px; padding: 1rem; margin-bottom: 2rem;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: var(--matrix-green); font-size: 0.9rem;">
                <i data-lucide="clock" style="width: 16px; height: 16px;"></i>
                <span>Redirecting to your account in <span id="countdown">5</span> seconds...</span>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            <a href="/account.html" class="cyber-button" style="background: linear-gradient(135deg, var(--matrix-green), #00cc7a);">
                <i data-lucide="package" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                View Your Orders
            </a>
            <a href="/index.html" class="cyber-button-secondary">
                <i data-lucide="shopping-bag" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 0.5rem;"></i>
                Continue Shopping
            </a>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order_id');
    if (orderId) {
        document.getElementById('orderId').textContent = orderId;
    }

    let countdown = 5;
    const countdownElement = document.getElementById('countdown');
    
    const interval = setInterval(() => {
        countdown--;
        countdownElement.textContent = countdown;
        
        if (countdown <= 0) {
            clearInterval(interval);
            window.location.href = '/account.html';
        }
    }, 1000);
</script>
<script>
    lucide.createIcons();
</script>
</body>
</html>
